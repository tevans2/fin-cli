[project]
name = "finance-v2"
version = "0.1.0"
description = "Finance CLI V2"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
ai = [
  "openai>=1.30",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
fin = "finance.cli.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["finance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
