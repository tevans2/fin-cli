[project]
name = "finance-v2"
version = "0.1.0"
description = "Finance CLI V2"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "textual>=0.61.0",
  "streamlit>=1.35.0",
  "plotly>=5.20.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
fin = "finance.cli.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["finance*"]
