{% extends "base.html" %}
{% block title %}transactions{% endblock %}
{% block content %}
<section class="panel">
  <h1>transactions</h1>

  <form class="filters" hx-get="/transactions" hx-target="#txn-table" hx-select="#txn-table"
        hx-swap="outerHTML" hx-trigger="change, search, keyup delay:300ms from:[name='q']" hx-push-url="true">
    {% set s = view.selected %}
    {% set o = view.options %}
    <input type="search" name="q" placeholder="search…" value="{{ s.query }}" autocomplete="off">
    <select name="bank">
      <option value="">all banks</option>
      {% for b in o.banks %}<option value="{{ b }}" {{ 'selected' if b == s.bank }}>{{ b }}</option>{% endfor %}
    </select>
    <select name="account">
      <option value="">all accounts</option>
      {% for a in o.accounts %}<option value="{{ a }}" {{ 'selected' if a == s.account }}>{{ a }}</option>{% endfor %}
    </select>
    <select name="category">
      <option value="">all categories</option>
      {% for c in o.categories %}<option value="{{ c }}" {{ 'selected' if c == s.category }}>{{ c }}</option>{% endfor %}
    </select>
    <select name="month">
      <option value="">all months</option>
      {% for m in o.months %}<option value="{{ m }}" {{ 'selected' if m == s.month }}>{{ m }}</option>{% endfor %}
    </select>
  </form>

  {% include "_txn_table.html" %}
</section>
{% endblock %}
