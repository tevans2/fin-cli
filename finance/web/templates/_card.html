<div
  id="txn"
  data-id="{{ record.id }}"
  data-description="{{ record.description }}"
  data-amount="{{ record.amount }}"
  data-currency="{{ record.currency }}">

  <div class="card-head">
    <span class="counter">{{ position }} / {{ total }}</span>
    <span class="dim">{{ remaining }} left</span>
  </div>

  <div class="txn-detail">
    <div class="txn-name">{{ record.alias or record.description }}</div>
    {% if record.alias %}<div class="txn-original dim">{{ record.description }}</div>{% endif %}
    <div class="txn-meta">
      <span class="{{ 'neg' if record.amount|float < 0 else 'pos' }}">{{ record.amount }} {{ record.currency }}</span>
      <span class="dim">· {{ record.date }}</span>
      <span class="dim">· {{ record.ledger_account }}</span>
    </div>
  </div>

  <form
    id="apply-form"
    hx-post="/categorize/{{ bank }}/apply"
    hx-target="#card"
    hx-swap="innerHTML">
    <input type="hidden" name="txn_id" value="{{ record.id }}">
    <input type="hidden" name="category" id="apply-category">
    <input
      type="text"
      id="picker-input"
      autocomplete="off"
      spellcheck="false"
      placeholder="Type to filter accounts…"
      value="{{ suggestion or '' }}">
  </form>
  <ul id="picker-list" class="picker"></ul>

  <div class="card-foot">
    <span class="key"><kbd>&crarr;</kbd> apply</span>
    <span class="key"><kbd>&uarr;</kbd><kbd>&darr;</kbd> move</span>
    <span class="key"><kbd>Alt</kbd>+<kbd>A</kbd> alias</span>
    <span class="key"><kbd>Alt</kbd>+<kbd>X</kbd> split</span>
    <span class="key"><kbd>Alt</kbd>+<kbd>S</kbd> skip</span>
  </div>

  <form id="skip-form" hx-post="/categorize/{{ bank }}/skip" hx-target="#card" hx-swap="innerHTML">
    <input type="hidden" name="txn_id" value="{{ record.id }}">
  </form>
</div>
